services:
  authpin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authpin-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_DRIVER=postgres
      - DATABASE_URL=postgres://authpin:secretpass@postgres:5432/authpin?sslmode=disable
      - MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AUTHPIN_MODE=standalone
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: authpin-postgres
    restart: always
    environment:
      POSTGRES_USER: authpin
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: authpin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authpin -d authpin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
